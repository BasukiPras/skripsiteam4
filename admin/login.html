<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<script src="../mock-api.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Gehenk Bike Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F7; --panel:#FFFFFF; --tint:#E3E8F4; --ink:#131B2E;
    --muted:#68708A; --navy:#1E3A70; --navy-deep:#0E1F3F; --sky:#2F6FA6; --rust:#C24A20; --line:#DDE3EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--navy-deep), #1B3563); color:var(--ink); font-family:'Inter', sans-serif;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:2.2rem; width:100%; max-width:380px; box-shadow:0 10px 30px rgba(14,31,63,.25);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:1.6rem;}
  .brand-mark{width:34px; height:34px; border-radius:50%; border:3px solid var(--sky); position:relative; flex-shrink:0;}
  .brand-mark::after{content:''; position:absolute; inset:0; margin:auto; width:4px; height:4px; background:var(--sky); border-radius:50%;}
  .brand-name{font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:15px; font-weight:600; line-height:1.1;}
  .brand-sub{font-size:10px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase;}
  h1{font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:18px; margin:0 0 .3rem;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 1.5rem;}
  label{font-size:12.5px; font-weight:500; margin-bottom:.35rem; display:block;}
  input{
    width:100%; padding:.65rem .8rem; border:1px solid var(--line); border-radius:8px;
    font-size:14px; margin-bottom:1rem; font-family:inherit; color:var(--ink);
  }
  input:focus{outline:none; border-color:var(--navy);}
  button{
    width:100%; padding:.8rem; border:none; border-radius:10px; background:var(--navy); color:#fff;
    font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:0 4px 0 var(--navy-deep);
    transition:transform .08s, box-shadow .08s;
  }
  button:hover{background:#16294D;}
  button:active{transform:translateY(3px); box-shadow:0 1px 0 var(--navy-deep);}
  button:disabled{opacity:.6; box-shadow:none; transform:none;}
  .error-msg{
    background:rgba(194,74,32,.1); border:1px solid var(--rust); color:var(--rust);
    font-size:12.5px; padding:.6rem .8rem; border-radius:8px; margin-bottom:1rem; display:none;
  }
  .back-link{display:block; text-align:center; margin-top:1.2rem; font-size:12.5px; color:var(--muted); text-decoration:none;}
  .back-link:hover{color:var(--navy);}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div><img src="../storage/Bike_Only.png" alt="Logo" width="75" height="50" class="d-inline-block align-text-top"></div>
    <div>
      
      <div class="brand-name">Gehenk Bike</div>
      <div class="brand-sub">by Cecep</div>
    </div>
  </div>

  <h1>Masuk ke Dashboard</h1>
  <p class="sub">Khusus untuk owner, dan mekanik Gehenk Bike.</p>

  <div class="error-msg" id="loginError"></div>

  <form id="formLogin">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="nama@gehenkbike.id" required autocomplete="username">

    <label for="password">Kata Sandi</label>
    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

    <button type="submit" id="btnLogin"><i class="bi bi-box-arrow-in-right me-1"></i><span id="btnLoginLabel">Masuk</span></button>
  </form>

  <a href="../company.html" class="back-link"><i class="bi bi-arrow-left me-1"></i>Kembali ke website</a>
</div>

<script>
  // Kosongkan kalau file ini disajikan satu server dengan Laravel.
  const API_BASE = '';

  const form = document.getElementById('formLogin');
  const btn = document.getElementById('btnLogin');
  const btnLabel = document.getElementById('btnLoginLabel');
  const errorBox = document.getElementById('loginError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btnLabel.textContent = 'Memproses...';

    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });

      const result = await res.json();

      if (!res.ok) {
        errorBox.textContent = result.message || 'Email atau kata sandi salah.';
        errorBox.style.display = 'block';
        return;
      }

      window.location.href = 'bengkel-dashboard.html';
    } catch (err) {
      errorBox.textContent = 'Gagal menghubungi server, coba lagi.';
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btnLabel.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
